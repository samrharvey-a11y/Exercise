const bin=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
const f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err');
const show=()=>{f.hidden=false;pw.focus()};
async function decrypt(key){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(D.iv)},key,bin(D.ct)))}
async function run(html){if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));document.open();document.write(html);document.close()}
async function auto(){let raw=null;try{raw=localStorage.getItem('repref.key')}catch(e){}
 if(raw){try{const k=await crypto.subtle.importKey('raw',bin(raw),'AES-GCM',false,['decrypt']);return run(await decrypt(k))}catch(e){try{localStorage.removeItem('repref.key')}catch(_){}}}show()}
f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Checking…';
 try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bin(D.salt),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  const html=await decrypt(k);try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));let s='';raw.forEach(b=>s+=String.fromCharCode(b));localStorage.setItem('repref.key',btoa(s))}catch(_){}
  run(html)}catch(x){err.textContent='Wrong password';go.disabled=false;go.textContent='Unlock';pw.select()}});
if(!window.crypto||!crypto.subtle){f.hidden=false;err.textContent='Open this page over https to unlock it.';go.disabled=true}else auto();
})();
