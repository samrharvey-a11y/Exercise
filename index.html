<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1012">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RepRef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1012;--p1:#171a1d;--p2:#1f2327;--line:#2b3035;--ink:#f1efe9;--mute:#9aa1a8;--acc:#ff4d2e;--acc2:#ff7a5c;--gold:#f2c14e;--ok:#5fd39a;--bad:#ff5d6c;--r:14px;
--disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overflow-x:clip}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--p2);border-radius:12px;min-height:44px;padding:0 16px;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-acc{background:var(--acc);color:#fff}.btn-gold{background:var(--gold);color:#1a1405}.btn-line{background:transparent;border:1.5px solid var(--line)}
input,select,textarea{background:var(--p2);border:1.5px solid var(--line);border-radius:10px;min-height:44px;padding:8px 12px;font-size:16px;width:100%}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,monospace;font-size:14px}
label{display:block;font-size:13px;color:var(--mute);font-weight:600}
h1,h2,h3{font-family:var(--disp);font-weight:800;line-height:1.05;margin:0;letter-spacing:.01em}
h1{font-size:40px}h2{font-size:28px}h3{font-size:22px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(14,16,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:.04em}.brand span{color:var(--acc)}
.hlvl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--mute)}
.hlvl b{color:var(--gold);font-family:var(--disp);font-size:20px}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.view{display:none}.view.on{display:block}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mute{color:var(--mute)}.small{font-size:13px}.gold{color:var(--gold)}.acc{color:var(--acc)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:#111417;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border-radius:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute);font-weight:600}
.tabs button.on{color:var(--ink)}.tabs button.on svg{color:var(--acc)}
.tabs svg{width:24px;height:24px}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.lvlbar{height:10px;background:var(--p2);border-radius:6px;overflow:hidden;margin-top:8px}.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffdd85);border-radius:6px}
.streak{display:flex;align-items:center;gap:10px}.streak .n{font-family:var(--disp);font-size:56px;font-weight:800;line-height:.9}
.flame{width:48px;height:48px;color:var(--acc)}.flame.cold{color:#3b4248}
.chal{position:relative;overflow:hidden;background:linear-gradient(135deg,#2a1410,#171a1d 60%);border-color:#5a2a1f}
.chal .fig{position:absolute;right:-6px;bottom:-8px;width:130px;height:130px;color:var(--acc);opacity:.9}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--p2);color:var(--mute)}
.tag.x2{background:var(--gold);color:#1a1405}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -16px;padding-inline:16px}
.qc{flex:none;width:118px;scroll-snap-align:start;background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;min-height:auto}
.qc svg{width:64px;height:64px;color:var(--ink)}.qc b{display:block;font-family:var(--disp);font-size:18px}.qc span{font-size:12px;color:var(--mute)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--p2);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{background:none;min-height:40px}.seg button.on{background:var(--p1);box-shadow:0 1px 0 var(--line)}
.wcard h3{margin-bottom:4px}.wcard .ex{font-size:14px;color:var(--mute);margin:6px 0 12px}
.figs{display:flex;gap:2px;margin:4px 0}.figs svg{width:34px;height:34px;color:var(--acc2)}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns button{flex:1 1 auto}
.bitem{background:var(--p2);border-radius:12px;padding:12px;margin-bottom:10px}
.bitem .head{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center}
.bitem .num{font-family:var(--disp);font-size:22px;color:var(--acc);text-align:center}
.bitem .mv{display:flex;gap:4px}.bitem .mv button{min-width:44px;padding:0;background:var(--p1)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;color:var(--ink)}
.tog input{width:22px;height:22px;min-height:0;accent-color:var(--acc)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}.setrow select{width:auto;min-width:130px}
.setrow input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--p2);border-radius:12px;padding:12px}.stat b{display:block;font-family:var(--disp);font-size:34px;line-height:1}.stat span{font-size:13px;color:var(--mute)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--p2);border-radius:12px;padding:12px;border:1.5px solid transparent;text-align:left;min-height:auto;display:block;font-weight:400}
.badge b{display:block;font-family:var(--disp);font-size:19px;color:var(--gold)}.badge span{font-size:12px;color:var(--mute)}
.badge.lock{opacity:.45}.badge.lock b{color:var(--ink)}.badge.eq{border-color:var(--gold)}
.list{margin:0;padding:0;list-style:none}.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.list li:last-child{border:0}
.num-r{font-variant-numeric:tabular-nums;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#111;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--p1);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.sheet h2{margin-bottom:10px}
.qrbox{background:#fff;border-radius:14px;padding:10px;width:min(260px,70vw);margin:10px auto}
.qrbox canvas{width:100%;display:block;image-rendering:pixelated}
.code{word-break:break-all;font-family:ui-monospace,monospace;font-size:12px;background:var(--p2);padding:10px;border-radius:10px;color:var(--mute)}
#scanv{width:100%;border-radius:12px;background:#000;max-height:50vh;object-fit:cover}
.preview{width:100%;border-radius:14px;display:block;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--gold);color:#1a1405;font-weight:700;font-size:13px;padding:4px 10px;border-radius:20px}

/* session */
#session{position:fixed;inset:0;z-index:30;background:#000;overflow:hidden}
#session[hidden]{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#vid{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
.hud-top{z-index:2;position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 30px;background:linear-gradient(rgba(0,0,0,.75),transparent)}
.hex{font-family:var(--disp);font-weight:800;font-size:clamp(26px,6vw,44px);line-height:1}
.hsub{font-size:14px;color:#cfd3d6;font-weight:600}
.hcenter{position:absolute;right:14px;top:calc(80px + env(safe-area-inset-top));text-align:right;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.big{font-family:var(--disp);font-weight:800;font-size:clamp(84px,24vw,190px);line-height:.85;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:#cfd3d6}
#hBigSub{font-weight:700;font-size:16px;color:#e6e6e6}
.cue{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);background:var(--acc);color:#fff;font-family:var(--disp);font-weight:800;font-size:clamp(28px,7vw,52px);padding:8px 22px;border-radius:14px;opacity:0;transition:.2s;white-space:nowrap;pointer-events:none}
.cue.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.chip{position:absolute;left:14px;top:calc(110px + env(safe-area-inset-top));background:rgba(0,0,0,.65);border:1px solid #444;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;opacity:0;transition:.3s}
.chip.on{opacity:1}
.dbg{position:absolute;left:14px;bottom:200px;font:12px ui-monospace,monospace;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:6px;color:#9f9}
.hud-bot{position:absolute;left:0;right:0;bottom:0;padding:30px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.85) 40%)}
.phase{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--disp);font-weight:800;font-size:clamp(26px,6vw,40px);line-height:1;margin-bottom:6px}
.phase span:last-child{color:var(--gold)}
.tl{position:relative;display:flex;height:14px;border-radius:8px;overflow:hidden;margin-bottom:10px;background:#222}
.tl i{display:block;height:100%;font-style:normal}
.tl .s0{background:#c43a22}.tl .s1{background:var(--gold)}.tl .s2{background:#3a8f6a}.tl .s3{background:#333}
#tlHead{position:absolute;top:-3px;bottom:-3px;width:4px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff}
.depth{position:relative;height:34px;border-radius:18px;background:#1c1f22;border:1.5px solid #3a3f44;margin-bottom:10px}
.depth .zone{position:absolute;right:0;top:0;bottom:0;width:12%;border-radius:0 18px 18px 0;background:repeating-linear-gradient(45deg,rgba(255,77,46,.35) 0 6px,transparent 6px 12px)}
.depth .lab{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:#8a9097}
.dot{position:absolute;top:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;transform:translateY(-50%)}
#dGhost{border:3px solid var(--gold);background:transparent}
#dYou{background:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.4)}
#dYou.good{background:var(--ok)}
.ctrls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ctrls button{background:rgba(40,44,48,.9);min-height:52px;padding:0 4px;font-size:15px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(8,9,10,.62)}
.overlay[hidden]{display:none}
.opanel{background:rgba(23,26,29,.94);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:440px;width:100%;text-align:center}
.opanel .ofig{width:120px;height:120px;color:var(--acc);margin:0 auto}
.opanel .obig{font-family:var(--disp);font-weight:800;font-size:96px;line-height:.9}
.ostatus{margin:12px 0;padding:10px;border-radius:12px;background:var(--p2);font-weight:700}
.ostatus.go{background:#1d3a2c;color:var(--ok)}
.ring{width:60px;height:60px;margin:6px auto 0}
.hand{font-size:13px;color:var(--mute);margin-top:8px}
@media (orientation:landscape) and (max-height:500px){.big{font-size:110px}.hcenter{top:60px}.ctrls button{min-height:40px}.hud-bot{padding-top:10px}.depth{height:26px}.dot{width:22px;height:22px;margin-left:-11px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="brand">REP<span>REF</span></div><div class="hlvl" id="hdr"></div></header>
<main>
  <section id="v-home" class="view on"></section>
  <section id="v-workouts" class="view"></section>
  <section id="v-builder" class="view"></section>
  <section id="v-profile" class="view"></section>
  <section id="v-settings" class="view"></section>
  <section id="v-summary" class="view"></section>
</main>
<nav class="tabs" id="tabs">
  <button data-go="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-go="workouts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Workouts</button>
  <button data-go="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>Profile</button>
  <button data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</button>
</nav>

<div id="session" hidden>
  <canvas id="cv"></canvas>
  <video id="vid" playsinline muted autoplay></video>
  <div class="hud-top"><div><div class="hex" id="hEx"></div><div class="hsub" id="hSub"></div></div><button data-act="end" class="btn-line" style="background:rgba(0,0,0,.4)">End</button></div>
  <div class="hcenter"><div class="big" id="hBig"></div><div id="hBigSub"></div></div>
  <div class="chip" id="hChip"></div>
  <div class="cue" id="hCue"></div>
  <div class="dbg" id="hDbg" hidden></div>
  <div class="hud-bot">
    <div id="tempoWrap">
      <div class="phase"><span id="phLbl"></span><span id="phRem"></span></div>
      <div class="tl" id="tl"></div>
    </div>
    <div class="depth" id="depth"><div class="zone"></div><span class="lab" style="left:12px">START</span><span class="lab" style="right:14px">TARGET</span><div class="dot" id="dGhost"></div><div class="dot" id="dYou"></div></div>
    <div class="ctrls"><button data-act="minus">−1</button><button data-act="plus">+1</button><button data-act="pause" id="bPause">Pause</button><button data-act="skip">Skip</button><button data-act="itemdone">Done</button></div>
  </div>
  <div class="overlay" id="ov"><div class="opanel" id="ovp"></div></div>
</div>

<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,.txt,application/json,text/plain" hidden>

<script>
{
/* ============ utilities ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const store={get(k,d){try{const v=localStorage.getItem('repref.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('repref.'+k,JSON.stringify(v))}catch(e){}}};
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const dayKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const daysBetween=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const fmtTime=s=>{s=Math.round(s);return s>=60?`${Math.floor(s/60)}:${pad(s%60)}`:`${s}s`};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
const scripts={};function loadScript(u){return scripts[u]||(scripts[u]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>{delete scripts[u];rej(new Error('Could not load '+u))};document.head.appendChild(s)}))}
const LIB={qr:'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js',jsqr:'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js',pdf:'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',mp:'0.10.14'};

/* ============ exercises ============ */
const SIDE={l:{sh:11,el:13,wr:15,hip:23,kn:25,an:27},r:{sh:12,el:14,wr:16,hip:24,kn:26,an:28}};
const ang=(a,b,c)=>{let d=Math.abs(Math.atan2(a.y-b.y,a.x-b.x)-Math.atan2(c.y-b.y,c.x-b.x))*180/Math.PI;return d>180?360-d:d};
const fromVert=(t,b)=>Math.abs(Math.atan2(t.x-b.x,b.y-t.y))*180/Math.PI;
const fromHoriz=(a,b)=>{let d=Math.abs(Math.atan2(b.y-a.y,b.x-a.x))*180/Math.PI;return d>90?180-d:d};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2,v:Math.min(a.v,b.v)});
let FW=640,FH=480;
const inF=p=>p.x>-.03*FW&&p.x<1.03*FW&&p.y>-.03*FH&&p.y<1.03*FH;
function best(L,keys){let sl=0,sr=0;for(const k of keys){sl+=L[SIDE.l[k]].v;sr+=L[SIDE.r[k]].v}const s=sl>=sr?SIDE.l:SIDE.r,o={};for(const k in s)o[k]=L[s[k]];o.vis=Math.max(sl,sr)/keys.length;return o}
function both(L,keys){let t=0;for(const k of keys)t+=L[SIDE.l[k]].v+L[SIDE.r[k]].v;return t/(keys.length*2)}
// line sag: >0 if hip is below the shoulder–ankle line (image y grows downward)
function sag(s){const t=(s.hip.x-s.sh.x)/((s.an.x-s.sh.x)||1e-6);return s.hip.y-(s.sh.y+t*(s.an.y-s.sh.y))}

const EX={
 squat:{name:'Squats',one:'squat',kind:'rep',view:'Side-on',tip:'Stand side-on to the phone, feet shoulder-width apart. Whole body in frame.',tempo:[2,0,1],ph:['Down','Hold','Up'],top:165,bot:100,low:'Go lower',start:'Stand up tall to start',def:10,
  val(L){const s=best(L,['sh','hip','kn','an']);return{ok:s.vis>.55&&inF(s.an)&&inF(s.sh),v:ang(s.hip,s.kn,s.an),s}},
  gate(m){return fromVert(m.s.sh,m.s.an)<45},gateCue:'Stand up straight',
  faults(m,p){return p>.6&&fromVert(m.s.sh,m.s.hip)>50?['Chest up']:[]}},
 pushup:{name:'Push-ups',one:'push-up',kind:'rep',view:'Side-on',tip:'Phone on the floor, side-on to you, about 2 m away. Start at the top, arms straight.',tempo:[2,0,1],ph:['Down','Hold','Up'],top:155,bot:95,low:'Chest lower',start:'Get into the top of a push-up',def:10,

  gate(m){return fromHoriz(m.s.sh,m.s.an)<40},gateCue:'Get into push-up position',

function qrCanvas(text,size){const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),cell=Math.max(2,Math.floor(size/(n+8))),c=document.createElement('canvas');c.width=c.height=cell*(n+8);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+4)*cell,(r+4)*cell,cell,cell);return c}

 if(st.rest>0){const nx=s.steps[s.si+1];s.state='rest';s.restLeft=st.rest;s.restBeep=0;overlay(`<div class="mute" style="font-weight:700">REST</div><div class="obig" id="restN">${st.rest}</div><div class="ofig" style="width:90px;height:90px">${figSVG(nx.it.ex)}</div><div style="font-weight:700">Next: ${esc(itemLabel(nx.it))}</div><div class="btns" style="margin-top:12px"><button class="btn-acc" data-act="skiprest">Skip rest</button><button data-act="addrest">+15s</button></div><div class="hand">Raise a hand to skip the rest.</div>`);say(`Rest ${st.rest} seconds. Next, ${EX[nx.it.ex].name}.`)}
 else goStep(s.si+1)}
function pause(){const s=SES;if(!s||['loading','done','rest'].includes(s.state))return;s.prev=s.state==='active'?'active':'setup';s.state='paused';overlay(`<h2>Paused</h2><p class="mute">Raise a hand or tap resume.</p><div class="btns"><button class="btn-acc" data-act="resume">Resume</button><button data-act="end">End workout</button></div>`)}
function resume(){const s=SES;if(!s||s.state!=='paused')return;if(s.prev==='active'){s.state='active';overlay(null);s.rep={st:'top'};s.g0=performance.now()/1000}else goStep(s.si)}
function manualDone(){const s=SES;if(!s)return;const st=s.steps[s.si];if(!['setup','active','count','paused'].includes(s.state))return;const r=s.res;
 if(EX[st.it.ex].kind==='hold'){const add=Math.max(0,st.it.v-r.hold);r.manualHold+=add}else if(st.it.k==='reps'){const add=Math.max(0,st.it.v-r.reps);r.reps+=add;r.manual+=add;r.xp+=add*3}
 overlay(null);completeStep()}
function plusRep(d){const s=SES;if(!s||s.state!=='active')return;const st=s.steps[s.si],r=s.res;if(EX[st.it.ex].kind==='hold')return;
 if(d>0){r.reps++;r.manual++;r.xp+=3;r.repXp.push(3);updateBig();if(st.it.k==='reps'&&r.reps>=st.it.v)completeStep()}else if(r.reps>0){r.reps--;r.xp-=r.repXp.pop()||0;if(r.manual>0)r.manual--;else r.tracked=Math.max(0,r.tracked-1);updateBig()}}
function closeSession(){cancelAnimationFrame(raf);stopCam();try{wake&&wake.release()}catch(e){}wake=null;try{speechSynthesis.cancel()}catch(e){}$('#session').hidden=true;document.body.style.overflow='';overlay(null);SES=null}

function finish(partial){const s=SES;if(!s)return;if(s.state==='active'||s.state==='setup'||s.state==='paused'){const r=s.res;if(r&&(r.reps>0||r.hold>0)&&!s.results.includes(r)){s.state='x';const st=s.steps[s.si];r.t1=Date.now();r.t0=r.t0||r.t1;if(EX[st.it.ex].kind==='hold'){r.formN=1;r.formSum=Math.round(r.good/r.hold*100);r.xp+=Math.round(r.hold*2*(.5+.5*r.good/r.hold))}s.results.push(r)}}
 s.state='done';const res=s.results,w=s.w;closeSession();
 const reps=res.reduce((a,r)=>a+r.reps,0),holdT=res.reduce((a,r)=>a+r.hold+r.manualHold,0);if(!reps&&!holdT){toast('Nothing recorded — no XP this time');go(view==='summary'?'home':view);return}
 const before=level(P.xp),fN=res.reduce((a,r)=>a+r.formN,0),fS=res.reduce((a,r)=>a+r.formSum,0),tN=res.reduce((a,r)=>a+r.tempoN,0),tS=res.reduce((a,r)=>a+r.tempoSum,0);
 const R={name:w.name,end:Date.now(),dur:(Date.now()-s.start)/1000,reps,manual:res.reduce((a,r)=>a+r.manual,0),tracked:res.reduce((a,r)=>a+r.tracked,0),formN:fN,formAvg:fN?Math.round(fS/fN):0,tempoN:tN,tempoAvg:tN?Math.round(tS/tN):0,partial,xpParts:[],pbs:[],newBadges:[]};
 const byEx={};for(const r of res){const e=byEx[r.ex]||(byEx[r.ex]={ex:r.ex,reps:0,hold:0,fs:0,fn:0,ts:0,tn:0});e.reps+=r.reps;e.hold+=r.hold+r.manualHold;e.fs+=r.formSum;e.fn+=r.formN;e.ts+=r.tempoSum;e.tn+=r.tempoN}
 R.byEx=Object.values(byEx).map(e=>({ex:e.ex,reps:e.reps,hold:Math.round(e.hold),form:e.fn?Math.round(e.fs/e.fn):null,tempo:e.tn?Math.round(e.ts/e.tn):null}));
 // streak
 const t=dayKey(),firstToday=P.lastDay!==t;if(firstToday){const gap=P.lastDay?daysBetween(P.lastDay,t):null;if(gap===1)P.streak++;else if(gap>1&&P.freezes>=gap-1){P.freezes-=gap-1;P.streak++;R.usedFreeze=true}else P.streak=1;P.lastDay=t;if(P.streak%7===0)P.freezes=Math.min(2,P.freezes+1);P.bestStreak=Math.max(P.bestStreak,P.streak)}
 // xp
 let base=res.reduce((a,r)=>a+r.xp,0);R.xpParts.push(['Reps & holds',base]);let xp=base;
 if(!partial){const b=50+10*w.items.length*w.rounds;xp+=b;R.xpParts.push(['Workout complete',b])}
 if(firstToday){xp+=25;R.xpParts.push(['First workout today',25])}
 if(w.challenge&&!partial){if(P.chalDay!==t){P.chalDay=t;P.chals++;xp=xp*2+100;R.xpParts.push(["Daily challenge (2× + 100)",'×2 +100'])}}
 const mult=1+Math.min(.5,.05*(P.streak-1));if(mult>1){xp=Math.round(xp*mult);R.xpParts.push([`${P.streak}-day streak bonus`,'×'+mult.toFixed(2)])}
 R.xp=Math.round(xp);P.xp+=R.xp;
 for(const r of res){P.totals[r.ex]=(P.totals[r.ex]||0)+r.reps;if(EX[r.ex].kind==='hold')P.holds[r.ex]=Math.round((P.holds[r.ex]||0)+r.hold+r.manualHold)}P.tracked+=R.tracked;P.sessions++;
 // PBs
 const pb=(k,v,label,fmt)=>{if(v>(P.pbs[k]||0)){const had=k in P.pbs;P.pbs[k]=v;if(had)R.pbs.push([label,fmt])}};
 for(const r of res){if(r.k==='amrap'&&r.tracked)pb(`${r.ex}|amrap|${r.target}`,r.reps,`${EX[r.ex].name} in ${fmtTime(r.target)}`,r.reps+' reps');if(r.k==='hold'&&r.hold)pb(`${r.ex}|hold`,Math.round(r.hold),`Longest ${EX[r.ex].name.toLowerCase()}`,fmtTime(r.hold))}
 if(R.formN>=10)pb('form',R.formAvg,'Best workout form',R.formAvg+'%');if(R.tempoN>=10)pb('tempo',R.tempoAvg,'Best workout tempo',R.tempoAvg+'%');pb('xp',R.xp,'Most XP in a workout',R.xp+' XP');
 R.levelAfter=level(P.xp);R.levelUp=R.levelAfter>before;
 R.newBadges=checkBadges(R,true);
 P.history.unshift({name:w.name,end:R.end,reps,xp:R.xp});P.history=P.history.slice(0,60);saveP();lastR=R;go('summary');if(R.levelUp)say(`Level up! Level ${R.levelAfter}`)}

/* ============ actions ============ */
const ACT={
 setname(){const v=($('#nameIn')||{}).value;if(v&&v.trim()){P.name=v.trim().slice(0,24);saveP();R.home()}},
 start(b){const w=findW(b.dataset.id);if(w)startWorkout(w)},
 quick(b){const e=b.dataset.ex,x=EX[e];startWorkout({id:'q-'+e,name:`${x.kind==='hold'?x.def+'s':x.def} ${x.name.toLowerCase()}`,author:'',rounds:1,rr:0,items:[{ex:e,k:x.kind==='hold'?'hold':'reps',v:x.def,tempo:null,rest:0}]})},
 wtab(b){wTab=b.dataset.t;R.workouts()},
 new(){openBuilder(null)},
 edit(b){const w=MY.find(x=>x.id===b.dataset.id);if(w)openBuilder(w)},
 dup(b){const w=findW(b.dataset.id);if(w){const c=JSON.parse(JSON.stringify(w));c.id=null;c.name=(w.name+' (mine)').slice(0,40);c.author=P.name;openBuilder(c)}},
 del(b){const w=MY.find(x=>x.id===b.dataset.id);if(w)confirmSheet('Delete workout?',`“${w.name}” will be removed from this phone.`,'Delete',()=>{MY=MY.filter(x=>x.id!==w.id);saveMY();R.workouts()},true)},
 share(b){const w=findW(b.dataset.id);if(w)openShare(w)},
 async copycode(){const t=$('#codeTxt').textContent;try{await navigator.clipboard.writeText(t);toast('Copied');markShared()}catch(e){toast('Select the code and copy it')}},
 async sendcode(){const t=$('#codeTxt').textContent;if(navigator.share){try{await navigator.share({title:shareW.name,text:`Try my RepRef workout “${shareW.name}”: ${t}`});markShared()}catch(e){}}else ACT.copycode()},
 async planpng(){const c=await planCard(shareW);await shareFile(await toBlob(c),safeName(shareW.name)+'.png',shareW.name);markShared()},
 async planpdf(){try{const c=await planCard(shareW);dl(await toPDF(c,''),safeName(shareW.name)+'.pdf');markShared()}catch(e){toast('PDF needs an internet connection')}},
 planjson(){const w=shareW;dl(new Blob([JSON.stringify({app:'RepRef',version:1,workout:{name:w.name,author:w.author,rounds:w.rounds,rr:w.rr,items:w.items}},null,2)],{type:'application/json'}),safeName(w.name)+'.repref.json');markShared()},
 import(){openImport()},
 impgo(){tryImport($('#impTxt').value)},
 scan(){startScan()},
 impfile(){fileMode='import';$('#fileIn').click()},
 impsave(){if(!pendingImport)return;MY.unshift(pendingImport);saveMY();P.imported++;saveP();closeSheet();wTab='mine';go('workouts');toast('Saved to My workouts');checkBadges();pendingImport=null},
 close(){closeSheet()},
 confirm(){const f=confirmFn;closeSheet();f&&f()},
 badd(){D.items.push(it('squat','reps',10));R.builder()},
 up(b){const i=+b.closest('.bitem').dataset.i;if(i>0){[D.items[i-1],D.items[i]]=[D.items[i],D.items[i-1]];R.builder()}},
 down(b){const i=+b.closest('.bitem').dataset.i;if(i<D.items.length-1){[D.items[i+1],D.items[i]]=[D.items[i],D.items[i+1]];R.builder()}},
 rm(b){const i=+b.closest('.bitem').dataset.i;D.items.splice(i,1);R.builder()},
 bcancel(){D=null;go('workouts')},
 bsave(){if(saveBuilder()){go('workouts');toast('Workout saved')}},
 btest(){const w=saveBuilder();if(w){go('workouts');startWorkout(w)}},
 eps(){const list=['Rookie',...BADGES.filter(b=>P.badges.includes(b[0])).map(b=>b[1])];sheet(`<h2>Choose your epithet</h2><div class="badges">${list.map(e=>`<button class="badge${epithet()===e?' eq':''}" data-act="equip" data-ep="${esc(e)}"><b>${esc(e)}</b></button>`).join('')}</div><button style="width:100%;margin-top:12px" data-act="close">Close</button>`)},
 equip(b){P.ep=b.dataset.ep==='Rookie'?'':b.dataset.ep;saveP();closeSheet();R[view]&&R[view]();toast('Now known as '+epithet())},
 backup(){dl(new Blob([JSON.stringify({app:'RepRef',backup:1,profile:P,workouts:MY,settings:S})],{type:'application/json'}),'repref-backup-'+dayKey()+'.json')},
 restore(){fileMode='restore';$('#fileIn').click()},
 reset(){confirmSheet('Reset everything?','Your XP, streak, epithets and saved workouts on this phone will be deleted.','Reset',()=>{P=newProfile();MY=[];saveP();saveMY();go('home');toast('Reset done')},true)},
 async sumpng(){if(lastCard)dl(await toBlob(lastCard),safeName(lastR.name)+'-summary.png')},
 async sumpdf(){if(!lastCard)return;try{dl(await toPDF(lastCard),safeName(lastR.name)+'-summary.pdf')}catch(e){toast('PDF needs an internet connection')}},
 async sumshare(){if(lastCard)await shareFile(await toBlob(lastCard),safeName(lastR.name)+'-summary.png',lastR.name)},
 // session
 go(){audioUnlock();startCountdown()},
 skip(){const s=SES;if(!s)return;if(s.state==='rest')return goStep(s.si+1);overlay(null);completeStep()},
 itemdone(){manualDone()},
 plus(){plusRep(1)},minus(){plusRep(-1)},
 pause(){const s=SES;if(s&&s.state==='paused')resume();else pause()},
 resume(){resume()},
 skiprest(){if(SES&&SES.state==='rest')goStep(SES.si+1)},
 addrest(){if(SES&&SES.state==='rest')SES.restLeft+=15},
 end(){const s=SES;if(!s)return;const was=s.state;if(was!=='paused')pause();confirmSheet('End workout?','Reps you’ve done so far still count.','End workout',()=>finish(true))},
 abort(){closeSession()}
};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){if(view==='builder'&&D&&g.dataset.go!=='workouts'){D=null}go(g.dataset.go);return}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b)});
let fileMode='import';
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const txt=await f.text();
 if(fileMode==='restore'){try{const o=JSON.parse(txt);if(!o.backup)throw 0;P=Object.assign(newProfile(),o.profile||{});MY=(o.workouts||[]).map(normW).filter(Boolean);S=Object.assign(S,o.settings||{});saveP();saveMY();saveS();go('home');toast('Backup restored')}catch(_){toast('That isn’t a RepRef backup')}}
 else tryImport(txt)});

/* boot */
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{voice=null;pickVoice()};
go('home');
if(location.hash.startsWith('#w=')){const code=location.hash.slice(3);history.replaceState(null,'',location.pathname);tryImport(code)}
window.__repref={encodeW,decodeText,EX,progress,tempoScore,level,PRESETS,normW};
}
