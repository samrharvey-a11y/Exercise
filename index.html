async function decrypt(key){return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(D.iv)},key,bin(D.ct)))}
async function run(html){if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));document.open();document.write(html);document.close()}
async function auto(){let raw=null;try{raw=localStorage.getItem('repref.key')}catch(e){}
 if(raw){try{const k=await crypto.subtle.importKey('raw',bin(raw),'AES-GCM',false,['decrypt']);return run(await decrypt(k))}catch(e){try{localStorage.removeItem('repref.key')}catch(_){}}}show()}
